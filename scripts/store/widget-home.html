<!doctype html>
<!--
  An Android home screen with the OneTracker widget on it, for the store
  screenshots (the real widget is native and can't be captured in a browser).
  The widget is rebuilt from its own layouts — res/layout/widget_root.xml and
  widget_row.xml: same dp sizes, Figtree, AMOLED theme colours, the bar's
  icons, square posters, the grey ✓ — and filled with the rows widget.ts would
  push. shoot.mjs opens this page through the dev server and calls render().
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/node_modules/@fontsource-variable/figtree/index.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 348×778 dp: a phone with display size one step up, so the widget reads
     at store-thumbnail size (shoot.mjs renders it at 1170 px wide) */
  html, body { width: 348px; height: 778px; overflow: hidden; background: #1b2530; font-family: 'Figtree Variable', sans-serif; -webkit-font-smoothing: antialiased; }
  /* an abstract wallpaper in the Pixel manner: flat shapes, muted colours */
  .wall { position: absolute; inset: 0; overflow: hidden; background: #1b2530; }
  .wall i { position: absolute; border-radius: 50%; }
  .glance { position: absolute; left: 22px; top: 38px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.45); }
  .glance .d { font-size: 21px; font-weight: 600; }
  .glance .w { margin-top: 2px; font-size: 14px; font-weight: 500; opacity: .9; }

  /* the widget: widget_root.xml */
  .widget { position: absolute; left: 12px; right: 12px; top: 104px; padding: 10px; border-radius: 22px; background: var(--surface); }
  .bar { display: flex; padding-bottom: 8px; }
  .bar span { flex: 1; height: 26px; padding: 2px; display: flex; justify-content: center; }
  .bar svg { height: 22px; width: 22px; }
  /* widget_row.xml: a `line` frame 1dp around a `card2` card */
  .row { padding: 1px; border-radius: 14px; background: var(--line); margin-bottom: 6px; }
  .card { display: flex; align-items: center; padding: 8px; border-radius: 13px; background: var(--card2); }
  .poster { width: 42px; height: 60px; object-fit: cover; background: #2a2a33; flex: none; }
  .text { flex: 1; min-width: 0; margin-left: 10px; }
  .title { font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { margin-top: 2px; font-size: 12px; font-weight: 400; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .check { width: 40px; height: 40px; padding: 7px; margin-left: 6px; flex: none; position: relative; }
  .check svg { width: 26px; height: 26px; display: block; }
  /* a finger on the first ✓: the one thing the screenshot is about */
  .tap::before { content: ''; position: absolute; left: -4px; top: -4px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.18); box-shadow: 0 0 0 2px rgba(255,255,255,.45); }

  .apps { position: absolute; left: 0; right: 0; display: flex; justify-content: space-around; padding: 0 10px; }
  .app { width: 70px; text-align: center; color: #fff; font-size: 12px; font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .ico { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .ico svg { width: 26px; height: 26px; }
  .ico img { width: 56px; height: 56px; border-radius: 50%; }
  .search { position: absolute; left: 16px; right: 16px; bottom: 30px; height: 52px; border-radius: 26px; background: rgba(22,22,27,.92); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
  .search svg { width: 22px; height: 22px; }
  .nav { position: absolute; left: 50%; bottom: 10px; width: 110px; height: 4px; margin-left: -55px; border-radius: 2px; background: rgba(255,255,255,.8); }
</style>
</head>
<body>
<script>
// lucide-style glyphs; the four bar icons are the widget's own vectors
const P = (d, c, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`
const BAR = {
  tv: '<path d="M4 7 h16 a2 2 0 0 1 2 2 v11 a2 2 0 0 1 -2 2 h-16 a2 2 0 0 1 -2 -2 v-11 a2 2 0 0 1 2 -2 z"/><path d="M17 2 L12 7 L7 2"/>',
  film: '<path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',
  books: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  games: '<path d="M6 12h4"/><path d="M8 10v4"/><path d="M15 13h0.01"/><path d="M18 11h0.01"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5Z"/>',
}
// ic_widget_check_box.xml: half-alpha frame + tick, tinted ink2
const CHECK = (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-linecap="round" stroke-linejoin="round">
  <path stroke-opacity=".5" stroke-width="1.8" d="M8.5 2.6 L15.5 2.6 A5.9 5.9 0 0 1 21.4 8.5 L21.4 15.5 A5.9 5.9 0 0 1 15.5 21.4 L8.5 21.4 A5.9 5.9 0 0 1 2.6 15.5 L2.6 8.5 A5.9 5.9 0 0 1 8.5 2.6 Z"/>
  <path stroke-width="2.2" d="M7.8 12.3 L10.7 15.2 L16.2 9.2"/></svg>`
const GLYPH = {
  photos: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  weather: '<path d="M12 2v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="M20 12h2"/><path d="m19.1 4.9-1.4 1.4"/><path d="M15.9 13a4 4 0 1 0-6.6-4.3"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/>',
  notes: '<path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/><path d="M15 3v6h6"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/>',
  chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
}

window.render = (d) => {
  const th = d.theme
  for (const [k, v] of Object.entries(th)) document.documentElement.style.setProperty(`--${k}`, v)
  const app = (glyph, bg, label) =>
    `<div class="app"><div class="ico" style="background:${bg}">${P(GLYPH[glyph], '#fff')}</div>${label ?? ''}</div>`
  document.body.innerHTML = `
    <div class="wall">
      <i style="width:600px;height:600px;left:-330px;top:330px;background:#2d4b55"></i>
      <i style="width:380px;height:380px;right:-190px;top:20px;background:#c48a45"></i>
      <i style="width:470px;height:470px;left:110px;top:560px;background:#d9bf98"></i>
      <i style="width:260px;height:260px;right:-110px;top:470px;background:#3a6280"></i>
    </div>
    <div class="glance"><div class="d">${d.date}</div><div class="w">${d.weather}</div></div>
    <div class="widget">
      <div class="bar">${['tv', 'film', 'books', 'games']
        .map((k, i) => `<span>${P(BAR[k], i === 0 ? th.accent : th.ink3)}</span>`).join('')}</div>
      ${d.rows.map((r, i) => `
        <div class="row"><div class="card">
          <img class="poster" src="${r.poster}">
          <div class="text"><div class="title">${r.title}</div><div class="sub">${r.sub}</div></div>
          <div class="check ${i === 0 ? 'tap' : ''}">${CHECK(th.ink2)}</div>
        </div></div>`).join('')}
    </div>
    <div class="apps" style="top:${d.appsTop}px">
      <div class="app"><div class="ico" style="background:#000"><img src="/logo.svg"></div>OneTracker</div>
      ${app('photos', '#3a6ea5', d.labels[0])}${app('weather', '#d08a2c', d.labels[1])}${app('notes', '#5b8c5a', d.labels[2])}
    </div>
    <div class="apps" style="bottom:94px">
      ${app('phone', '#2f6f4f')}${app('chat', '#355c9b')}${app('camera', '#56565f')}${app('globe', '#8a4b3c')}
    </div>
    <div class="search">${P(GLYPH.search, '#d4d4d8')}${P(GLYPH.mic, '#d4d4d8')}</div>
    <div class="nav"></div>`
  return Promise.all([...document.images].map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r })))
}
</script>
</body>
</html>
